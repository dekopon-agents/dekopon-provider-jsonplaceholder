[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Wasmtime 48 reaches encoding_rs through the SDK's non-default `host` feature, used only by the
# dev-dependency broker host. Its `(Apache-2.0 OR MIT) AND BSD-3-Clause` never enters the shipped
# wasm32-unknown-unknown closure, so name the one crate instead of allowing BSD-3-Clause globally.
[[licenses.exceptions]]
crate = "encoding_rs"
allow = ["BSD-3-Clause"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
