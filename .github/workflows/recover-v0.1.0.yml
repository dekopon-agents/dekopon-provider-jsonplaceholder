name: Recover v0.1.0 from immutable tagged artifacts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact acknowledgement for the one pinned recovery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "32810190719"
  SOURCE_RUN_ATTEMPT: "1"
  SOURCE_SHA: dc925dd23240d2dbd3bd9c534347fd33552bbdf6
  SOURCE_TAG: v0.1.0
  SOURCE_TAG_OBJECT: 41aaaa84aee32013c232a4186e4bb717081de256
  SOURCE_REF: refs/tags/v0.1.0
  EXPECTED_SHA: 9562744e6c209a447cafcfe09d11a50ea1926945a4b52099714c7328c2fd5e5d
  EXPECTED_SBOM_SHA: 22c324de452e9d23b458702adcc4886df2bb4f4bfacc44a1807f09edd0442bc5
  RECOVERY_CONFIRMATION: recover-v0.1.0-from-run-32810190719
  RELEASE_RUST: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"
  ORAS_VERSION: "1.2.3"
  ORAS_LINUX_AMD64_SHA256: b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827
  OCI_REPOSITORY: ghcr.io/dekopon-agents/provider-jsonplaceholder
  PACKAGE_ENDPOINT: orgs/dekopon-agents/packages/container/provider-jsonplaceholder

jobs:
  build:
    name: Recover and verify immutable tagged bytes
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Inspect the green recovery CI and source run; download its two artifacts.
      contents: read # Verify main, the annotated tag, and absence of a release.
      packages: read # Prove the destination package remains absent.
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Check out the auditable recovery commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact confirmation, recovery scope, green CI, tag, and destination absence
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "dekopon-agents/dekopon-provider-jsonplaceholder" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CONFIRMATION" == "$RECOVERY_CONFIRMATION" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          [[ "$(git cat-file -t "refs/tags/$SOURCE_TAG")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG")" == "$SOURCE_TAG_OBJECT" ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG^{}")" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          changed=$(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA" | LC_ALL=C sort)
          [[ "$changed" == $'.github/workflows/recover-v0.1.0.yml\n.github/workflows/release.yml\nscripts/recover-v0.1.0-artifacts.sh\nscripts/validate-workflows.sh' ]]

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
            >"$RUNNER_TEMP/main-runs.jsons"
          jq -e --arg sha "$GITHUB_SHA" '
            [.[].workflow_runs[] | select(
              .name == "CI" and .path == ".github/workflows/ci.yml" and
              .event == "push" and .head_sha == $sha and
              .status == "completed" and .conclusion == "success"
            )] | length == 1
          ' "$RUNNER_TEMP/main-runs.jsons" >/dev/null

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq 'add // []' >"$RUNNER_TEMP/releases.json"
          [[ "$(jq --arg tag "$SOURCE_TAG" \
            '[.[] | select(.tag_name == $tag)] | length' \
            "$RUNNER_TEMP/releases.json")" == 0 ]]
          body="$RUNNER_TEMP/package.json"
          status=$(curl --silent --show-error --location \
            --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/$PACKAGE_ENDPOINT")
          [[ "$status" == 404 ]]
          echo 'version=0.1.0' >>"$GITHUB_OUTPUT"

      - name: Download and independently verify only the tagged run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/recover-v0.1.0-artifacts.sh "$RUNNER_TEMP/tagged"

      - name: Stage exact source artifacts and record digest
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp "$RUNNER_TEMP/tagged/component/jsonplaceholder-provider.wasm" dist/release/
          cp "$RUNNER_TEMP/tagged/component/jsonplaceholder-provider.wasm.sha256" dist/release/
          cp "$RUNNER_TEMP/tagged/sbom/jsonplaceholder-provider.cdx.json" dist/
          test "$(find dist/release -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          (cd dist/release && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          [[ "$(shasum -a 256 dist/jsonplaceholder-provider.cdx.json | awk '{print $1}')" == \
             "$EXPECTED_SBOM_SHA" ]]
          sha256=$(awk '{print $1}' dist/release/jsonplaceholder-provider.wasm.sha256)
          [[ "$sha256" == "$EXPECTED_SHA" ]]
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          git diff --exit-code

      - name: Re-upload exact source component for permission-separated recovery jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-component
          path: |
            dist/release/jsonplaceholder-provider.wasm
            dist/release/jsonplaceholder-provider.wasm.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Re-upload exact source SBOM for independent attestation verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: dist/jsonplaceholder-provider.cdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Verify existing tagged provenance and SBOM attestations
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's verified copies of the source artifacts.
      contents: read # Check out the immutable tagged verifier; no attestation is created or replaced.
    steps:
      - name: Check out the immutable tagged verifier without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Download exact recovery component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Download exact recovery SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-sbom
          path: sbom
      - name: Verify bytes, SBOM, and both original tag-run identities
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          [[ "$(shasum -a 256 sbom/jsonplaceholder-provider.cdx.json | awk '{print $1}')" == \
             "$EXPECTED_SBOM_SHA" ]]
          for predicate in 'https://slsa.dev/provenance/v1' 'https://cyclonedx.org/bom'; do
            ./scripts/verify-attestation-anonymously.sh \
              dist/jsonplaceholder-provider.wasm \
              "$GITHUB_REPOSITORY" \
              "$EXPECTED_SHA" \
              "$predicate" \
              "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              "$SOURCE_REF" \
              "$SOURCE_SHA" \
              "$SOURCE_RUN_ID" \
              "$SOURCE_RUN_ATTEMPT"
          done

  draft:
    name: Create one owned draft release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's verified source artifact.
      contents: write # Draft discovery, creation, asset upload, and deletion.
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      wasm_asset_id: ${{ steps.upload.outputs.wasm_asset_id }}
      checksum_asset_id: ${{ steps.upload.outputs.checksum_asset_id }}
      marker: ${{ steps.create.outputs.marker }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out for a fresh release-ref check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Download verified component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Reverify tag, bytes, and absence of any existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" == "v0.1.0" ]]
          git fetch --force origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git cat-file -t "refs/tags/$SOURCE_TAG")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG^{}")" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          (cd dist && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/releases.json"
          count=$(jq --arg tag "$SOURCE_TAG" \
            '[.[] | select(.tag_name == $tag)] | length' "$RUNNER_TEMP/releases.json")
          [[ "$count" == 0 ]] || {
            echo "error: refusing to reuse any existing release for $SOURCE_TAG" >&2
            exit 1
          }

      - name: Create and capture this run's exact draft release ID
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="provider-jsonplaceholder-run:$SOURCE_RUN_ID:$SOURCE_RUN_ATTEMPT"
          printf '%s\n\n%s\n' \
            "$marker" \
            'Typed JSONPlaceholder GET and create provider for Dekopon 0.11.1. posts.create is a non-idempotent external write; JSONPlaceholder returns a synthetic record and does not persist it. Verify the component with the attached checksum and public GitHub attestations.' \
            >"$RUNNER_TEMP/release-notes.md"
          gh release create "$SOURCE_TAG" \
            --verify-tag \
            --draft \
            --title "$SOURCE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" >/dev/null
          release_id=
          for _attempt in {1..12}; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq 'add // []' >"$RUNNER_TEMP/releases-after-create.json"
            release_id=$(jq -r --arg tag "$SOURCE_TAG" --arg marker "$marker" '
              [.[] | select(
                .tag_name == $tag and .draft == true and .prerelease == false and
                ((.body // "") | startswith($marker)) and (.assets | length) == 0
              )] | if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/releases-after-create.json")
            if [[ "$release_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            sleep 5
          done
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"
          echo "marker=$marker" >>"$GITHUB_OUTPUT"

      - name: Upload assets by captured release ID and capture both asset IDs
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          upload_asset() {
            local name=$1
            local output=$2
            curl --fail --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@dist/$name" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              >"$output"
          }
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          upload_asset jsonplaceholder-provider.wasm "$RUNNER_TEMP/wasm-asset.json"
          upload_asset jsonplaceholder-provider.wasm.sha256 "$RUNNER_TEMP/checksum-asset.json"
          wasm_asset_id=$(jq -er 'select(.name == "jsonplaceholder-provider.wasm") | .id' \
            "$RUNNER_TEMP/wasm-asset.json")
          checksum_asset_id=$(jq -er 'select(.name == "jsonplaceholder-provider.wasm.sha256") | .id' \
            "$RUNNER_TEMP/checksum-asset.json")
          [[ "$wasm_asset_id" =~ ^[0-9]+$ ]]
          [[ "$checksum_asset_id" =~ ^[0-9]+$ ]]
          echo "wasm_asset_id=$wasm_asset_id" >>"$GITHUB_OUTPUT"
          echo "checksum_asset_id=$checksum_asset_id" >>"$GITHUB_OUTPUT"

      - name: Verify exact owned draft metadata and re-downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          WASM_ASSET_ID: ${{ steps.upload.outputs.wasm_asset_id }}
          CHECKSUM_ASSET_ID: ${{ steps.upload.outputs.checksum_asset_id }}
          MARKER: ${{ steps.create.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/releases-after-create.json"
          jq -e --arg tag "$SOURCE_TAG" --argjson id "$RELEASE_ID" '
            [.[] | select(.tag_name == $tag) | .id] == [$id]
          ' "$RUNNER_TEMP/releases-after-create.json" >/dev/null
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --arg marker "$MARKER" \
            --argjson release_id "$RELEASE_ID" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .id == $release_id and
              .tag_name == $tag and
              .draft == true and
              .prerelease == false and
              ((.body // "") | startswith($marker)) and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "jsonplaceholder-provider.wasm", id: $wasm_id},
                  {name: "jsonplaceholder-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$release" >/dev/null
          mkdir "$RUNNER_TEMP/draft-assets"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$WASM_ASSET_ID" \
            >"$RUNNER_TEMP/draft-assets/jsonplaceholder-provider.wasm"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUM_ASSET_ID" \
            >"$RUNNER_TEMP/draft-assets/jsonplaceholder-provider.wasm.sha256"
          (cd "$RUNNER_TEMP/draft-assets" && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          cmp dist/jsonplaceholder-provider.wasm "$RUNNER_TEMP/draft-assets/jsonplaceholder-provider.wasm"
          cmp dist/jsonplaceholder-provider.wasm.sha256 \
            "$RUNNER_TEMP/draft-assets/jsonplaceholder-provider.wasm.sha256"

  ghcr:
    name: Create, validate, then expose one OCI layer
    needs: [build, draft]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's re-uploaded immutable source artifact.
      contents: write # GitHub requires write authority to read a draft release by ID.
      packages: write # Create and change visibility of the one owned GHCR package.
    outputs:
      prior_visibility: ${{ steps.preflight.outputs.prior_visibility }}
      initial_visibility: ${{ steps.capture.outputs.initial_visibility }}
      manifest_digest: ${{ steps.layout.outputs.manifest_digest }}
      push_started: ${{ steps.state.outputs.push_started }}
      package_id: ${{ steps.capture.outputs.package_id }}
      package_version_id: ${{ steps.capture.outputs.package_version_id }}
      publicized: ${{ steps.publish.outputs.publicized }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Verify bytes and the captured owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          (cd dist && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e --arg tag "$SOURCE_TAG" \
            '.tag_name == $tag and .draft == true and .prerelease == false' \
            <<<"$release" >/dev/null
      - name: Install checksum-pinned ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/bin-oras"
      - name: Prove the v0.1.0 package is wholly absent before publication
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/package-before.json"
          status=$(curl --silent --show-error --location \
            --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/$PACKAGE_ENDPOINT")
          case "$status" in
            404)
              echo 'prior_visibility=absent' >>"$GITHUB_OUTPUT"
              ;;
            200)
              visibility=$(jq -er '.visibility' "$body")
              echo "prior_visibility=$visibility" >>"$GITHUB_OUTPUT"
              echo "error: v0.1.0 requires a provably absent package; found $visibility" >&2
              exit 1
              ;;
            *)
              echo "error: package absence check returned HTTP $status" >&2
              cat "$body" >&2
              exit 1
              ;;
          esac
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and capture one immutable local OCI manifest
        id: layout
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/oci-layout"
          (
            cd dist
            "$RUNNER_TEMP/bin-oras" push --oci-layout "$layout:$VERSION" \
              --artifact-type application/vnd.dekopon.provider.v1+wasm \
              --annotation "org.opencontainers.image.revision=$SOURCE_SHA" \
              --annotation "dev.dekopon.release-run=$SOURCE_RUN_ID.$SOURCE_RUN_ATTEMPT" \
              jsonplaceholder-provider.wasm:application/wasm
          )
          digest=$("$RUNNER_TEMP/bin-oras" resolve --oci-layout "$layout:$VERSION")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          "$RUNNER_TEMP/bin-oras" manifest fetch --oci-layout "$layout@$digest" \
            >"$RUNNER_TEMP/local-manifest.json"
          jq -e --arg layer "sha256:$EXPECTED_SHA" \
            --arg revision "$SOURCE_SHA" \
            --arg run "$SOURCE_RUN_ID.$SOURCE_RUN_ATTEMPT" '
              (.layers | length) == 1 and
              .layers[0].digest == $layer and
              .layers[0].mediaType == "application/wasm" and
              .layers[0].annotations["org.opencontainers.image.title"] == "jsonplaceholder-provider.wasm" and
              .annotations["org.opencontainers.image.revision"] == $revision and
              .annotations["dev.dekopon.release-run"] == $run
            ' "$RUNNER_TEMP/local-manifest.json" >/dev/null
          echo "manifest_digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Record immutable publication ownership before the remote copy
        id: state
        run: echo 'push_started=true' >>"$GITHUB_OUTPUT"
      - name: Copy the captured manifest to the previously absent package
        env:
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin-oras" cp --from-oci-layout \
            "$RUNNER_TEMP/oci-layout@$MANIFEST_DIGEST" "$OCI_REPOSITORY:$VERSION"
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "$OCI_REPOSITORY:$VERSION")" == \
             "$MANIFEST_DIGEST" ]]
      - name: Capture IDs and either allowed initial visibility after the exact version exists
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for _attempt in {1..12}; do
            if package=$(gh api "$PACKAGE_ENDPOINT" 2>/dev/null) && \
               gh api --paginate --slurp "$PACKAGE_ENDPOINT/versions?per_page=100" \
                 | jq 'add // []' >"$RUNNER_TEMP/versions.json"; then
              initial_visibility=$(jq -er '
                select(.visibility == "private" or .visibility == "public") | .visibility
              ' <<<"$package")
              package_id=$(jq -er '.id' <<<"$package")
              count=$(jq 'length' "$RUNNER_TEMP/versions.json")
              version_id=$(jq -r --arg digest "$MANIFEST_DIGEST" --arg tag "$VERSION" '
                .[] | select(.name == $digest and .metadata.container.tags == [$tag]) | .id
              ' "$RUNNER_TEMP/versions.json")
              if [[ "$package_id" =~ ^[0-9]+$ && "$count" == 1 && \
                    "$version_id" =~ ^[0-9]+$ ]]; then
                {
                  echo "initial_visibility=$initial_visibility"
                  echo "package_id=$package_id"
                  echo "package_version_id=$version_id"
                } >>"$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'error: exact package/version with private or public visibility did not become observable' >&2
          exit 1
      - name: Immediately verify captured bytes, manifest, and tag set under initial visibility
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          INITIAL_VISIBILITY: ${{ steps.capture.outputs.initial_visibility }}
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          PACKAGE_ID: ${{ steps.capture.outputs.package_id }}
          PACKAGE_VERSION_ID: ${{ steps.capture.outputs.package_version_id }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(gh api "$PACKAGE_ENDPOINT")
          gh api --paginate --slurp "$PACKAGE_ENDPOINT/versions?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/versions-after-capture.json"
          jq -e --argjson package_id "$PACKAGE_ID" --arg visibility "$INITIAL_VISIBILITY" '
            .id == $package_id and .visibility == $visibility and
            ($visibility == "private" or $visibility == "public")
          ' <<<"$package" >/dev/null
          jq -e --argjson id "$PACKAGE_VERSION_ID" \
            --arg digest "$MANIFEST_DIGEST" --arg tag "$VERSION" '
              length == 1 and
              .[0].id == $id and
              .[0].name == $digest and
              .[0].metadata.container.tags == [$tag]
            ' "$RUNNER_TEMP/versions-after-capture.json" >/dev/null

          registry=()
          pull_dir="$RUNNER_TEMP/private-pull"
          if [[ "$INITIAL_VISIBILITY" == public ]]; then
            printf '{"auths":{}}\n' >"$RUNNER_TEMP/initial-anonymous-auth.json"
            registry=(--registry-config "$RUNNER_TEMP/initial-anonymous-auth.json")
            pull_dir="$RUNNER_TEMP/initial-public-pull"
          fi
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "${registry[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          "$RUNNER_TEMP/bin-oras" manifest fetch "${registry[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST" >"$RUNNER_TEMP/remote-manifest.json"
          cmp "$RUNNER_TEMP/local-manifest.json" "$RUNNER_TEMP/remote-manifest.json"
          jq -e --arg digest "sha256:$EXPECTED_SHA" '
            (.layers | length) == 1 and
            .layers[0].digest == $digest and
            .layers[0].mediaType == "application/wasm" and
            .layers[0].annotations["org.opencontainers.image.title"] == "jsonplaceholder-provider.wasm"
          ' "$RUNNER_TEMP/remote-manifest.json" >/dev/null
          rm -rf "$pull_dir" && mkdir "$pull_dir"
          (cd "$pull_dir" && "$RUNNER_TEMP/bin-oras" pull "${registry[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$pull_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/jsonplaceholder-provider.wasm "$pull_dir/jsonplaceholder-provider.wasm"
          [[ "$("$RUNNER_TEMP/bin-oras" repo tags "${registry[@]}" \
              "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]
      - name: Ensure the validated package is public
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_VISIBILITY: ${{ steps.capture.outputs.initial_visibility }}
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          PACKAGE_ID: ${{ steps.capture.outputs.package_id }}
          PACKAGE_VERSION_ID: ${{ steps.capture.outputs.package_version_id }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package=$(gh api "$PACKAGE_ENDPOINT")
          gh api --paginate --slurp "$PACKAGE_ENDPOINT/versions?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/versions-before-public.json"
          jq -e --argjson package_id "$PACKAGE_ID" --arg visibility "$INITIAL_VISIBILITY" '
            .id == $package_id and .visibility == $visibility and
            ($visibility == "private" or $visibility == "public")
          ' <<<"$package" >/dev/null
          jq -e --argjson id "$PACKAGE_VERSION_ID" \
            --arg digest "$MANIFEST_DIGEST" --arg tag "$VERSION" '
              length == 1 and
              .[0].id == $id and
              .[0].name == $digest and
              .[0].metadata.container.tags == [$tag]
            ' "$RUNNER_TEMP/versions-before-public.json" >/dev/null
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "$OCI_REPOSITORY:$VERSION")" == \
             "$MANIFEST_DIGEST" ]]
          [[ "$("$RUNNER_TEMP/bin-oras" repo tags "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]
          if [[ "$INITIAL_VISIBILITY" == private ]]; then
            gh api --method PATCH "$PACKAGE_ENDPOINT/visibility" \
              -f visibility=public >/dev/null
          fi
          [[ "$(gh api "$PACKAGE_ENDPOINT" --jq .visibility)" == public ]]
          echo 'publicized=true' >>"$GITHUB_OUTPUT"
      - name: Verify the now-public OCI artifact without credentials
        env:
          MANIFEST_DIGEST: ${{ steps.layout.outputs.manifest_digest }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-auth.json"
          anonymous=(--registry-config "$RUNNER_TEMP/anonymous-auth.json")
          [[ "$("$RUNNER_TEMP/bin-oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          rm -rf "$RUNNER_TEMP/public-pull" && mkdir "$RUNNER_TEMP/public-pull"
          (cd "$RUNNER_TEMP/public-pull" && \
            "$RUNNER_TEMP/bin-oras" pull "${anonymous[@]}" \
              "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$RUNNER_TEMP/public-pull" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp dist/jsonplaceholder-provider.wasm "$RUNNER_TEMP/public-pull/jsonplaceholder-provider.wasm"
          [[ "$("$RUNNER_TEMP/bin-oras" repo tags "${anonymous[@]}" \
              "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]

  finalize:
    name: Reverify immutable publication state, then finalize
    needs: [build, draft, ghcr]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only this recovery run's verified source artifact.
      contents: write # Read draft assets and change only the captured release.
      packages: read # Recheck the captured public package/version immediately before release.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out for the final release-ref check
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Download verified component
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-component
          path: dist
      - name: Install exact component and OCI tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          cargo "+$RELEASE_RUST" install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Re-download and verify everything immediately before publication
        env:
          CHECKSUM_ASSET_ID: ${{ needs.draft.outputs.checksum_asset_id }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
          PACKAGE_ID: ${{ needs.ghcr.outputs.package_id }}
          PACKAGE_VERSION_ID: ${{ needs.ghcr.outputs.package_version_id }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          VERSION: ${{ needs.build.outputs.version }}
          WASM_ASSET_ID: ${{ needs.draft.outputs.wasm_asset_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$WASM_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$CHECKSUM_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PACKAGE_ID" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_VERSION_ID" =~ ^[0-9]+$ ]]
          (cd dist && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          [[ "$(awk '{print $1}' dist/jsonplaceholder-provider.wasm.sha256)" == "$EXPECTED_SHA" ]]

          # The annotated tag and main are mutable server state, so peel both again now.
          git fetch --force origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git cat-file -t "refs/tags/$SOURCE_TAG")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG^{}")" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --argjson release_id "$RELEASE_ID" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .id == $release_id and
              .tag_name == $tag and
              .draft == true and
              .prerelease == false and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "jsonplaceholder-provider.wasm", id: $wasm_id},
                  {name: "jsonplaceholder-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$release" >/dev/null

          rm -rf "$RUNNER_TEMP/prepublish" && mkdir "$RUNNER_TEMP/prepublish"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$WASM_ASSET_ID" \
            >"$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUM_ASSET_ID" \
            >"$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm.sha256"
          (cd "$RUNNER_TEMP/prepublish" && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          [[ "$(awk '{print $1}' "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm.sha256")" == \
             "$EXPECTED_SHA" ]]
          cmp dist/jsonplaceholder-provider.wasm "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm"
          cmp dist/jsonplaceholder-provider.wasm.sha256 \
            "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm.sha256"

          # Attestations and GHCR are public before release publication; fetch each bundle without
          # credentials, verify from a clean gh config, and bind it to this exact tag commit.
          ./scripts/verify-attestation-anonymously.sh \
            "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm" \
            "$GITHUB_REPOSITORY" \
            "$EXPECTED_SHA" \
            'https://slsa.dev/provenance/v1' \
            "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            "$SOURCE_REF" \
            "$SOURCE_SHA" \
            "$SOURCE_RUN_ID" \
            "$SOURCE_RUN_ATTEMPT"
          ./scripts/verify-attestation-anonymously.sh \
            "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm" \
            "$GITHUB_REPOSITORY" \
            "$EXPECTED_SHA" \
            'https://cyclonedx.org/bom' \
            "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            "$SOURCE_REF" \
            "$SOURCE_SHA" \
            "$SOURCE_RUN_ID" \
            "$SOURCE_RUN_ATTEMPT"

          wasm-tools component wit --json "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm" \
            >"$RUNNER_TEMP/wit.json"
          wasm-tools component wit "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm" \
            >"$RUNNER_TEMP/component.wit"
          jq -e '
            (.worlds | length) == 1 and
            (.interfaces | length) == 1 and
            (.worlds[0].exports | keys | sort) == ["describe", "invoke"] and
            (.worlds[0].imports | length) == 1 and
            .packages[.interfaces[0].package].name == "dekopon:http@1.0.0" and
            .interfaces[0].name == "client" and
            (.interfaces[0].functions | keys) == ["send"] and
            ([.packages[].name] | sort) == ["dekopon:http@1.0.0", "root:component"]
          ' "$RUNNER_TEMP/wit.json" >/dev/null
          if grep -Eqi 'wasi:|wasix|wasi_snapshot|wasm-bindgen|js-sys' \
            "$RUNNER_TEMP/component.wit"; then
            echo 'error: ambient interface/runtime found in component' >&2
            exit 1
          fi

          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-auth.json"
          anonymous=(--registry-config "$RUNNER_TEMP/anonymous-auth.json")
          [[ "$("$RUNNER_TEMP/oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          "$RUNNER_TEMP/oras" manifest fetch "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST" >"$RUNNER_TEMP/manifest.json"
          jq -e --arg digest "sha256:$EXPECTED_SHA" '
            (.layers | length) == 1 and
            .layers[0].digest == $digest and
            .layers[0].mediaType == "application/wasm" and
            .layers[0].annotations["org.opencontainers.image.title"] == "jsonplaceholder-provider.wasm"
          ' "$RUNNER_TEMP/manifest.json" >/dev/null
          rm -rf "$RUNNER_TEMP/oci" && mkdir "$RUNNER_TEMP/oci"
          (cd "$RUNNER_TEMP/oci" && "$RUNNER_TEMP/oras" pull "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$RUNNER_TEMP/oci" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp "$RUNNER_TEMP/prepublish/jsonplaceholder-provider.wasm" \
            "$RUNNER_TEMP/oci/jsonplaceholder-provider.wasm"
          [[ "$("$RUNNER_TEMP/oras" repo tags "${anonymous[@]}" \
              "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]

          # Recheck every mutable pointer immediately before the only publication mutation.
          git fetch --force origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git cat-file -t "refs/tags/$SOURCE_TAG")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$SOURCE_TAG^{}")" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          [[ "$("$RUNNER_TEMP/oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          package=$(gh api "$PACKAGE_ENDPOINT")
          gh api --paginate --slurp "$PACKAGE_ENDPOINT/versions?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/versions-before-finalize.json"
          jq -e --argjson package_id "$PACKAGE_ID" '
            .id == $package_id and .visibility == "public"
          ' <<<"$package" >/dev/null
          jq -e --argjson id "$PACKAGE_VERSION_ID" \
            --arg digest "$MANIFEST_DIGEST" --arg tag "$VERSION" '
              length == 1 and
              .[0].id == $id and
              .[0].name == $digest and
              .[0].metadata.container.tags == [$tag]
            ' "$RUNNER_TEMP/versions-before-finalize.json" >/dev/null
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add // []' >"$RUNNER_TEMP/releases-before-finalize.json"
          jq -e --arg tag "$SOURCE_TAG" --argjson id "$RELEASE_ID" '
            [.[] | select(.tag_name == $tag) | .id] == [$id]
          ' "$RUNNER_TEMP/releases-before-finalize.json" >/dev/null
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .tag_name == $tag and .draft == true and .prerelease == false and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "jsonplaceholder-provider.wasm", id: $wasm_id},
                  {name: "jsonplaceholder-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$current" >/dev/null

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=false >"$RUNNER_TEMP/published.json"
          jq -e --arg tag "$SOURCE_TAG" --argjson id "$RELEASE_ID" '
            .id == $id and .tag_name == $tag and .draft == false and .prerelease == false
          ' "$RUNNER_TEMP/published.json" >/dev/null
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG")
          jq -e --argjson id "$RELEASE_ID" \
            '.id == $id and .draft == false and .prerelease == false' \
            <<<"$published" >/dev/null

  anonymous-verify:
    name: Anonymous public verification
    needs: [build, draft, ghcr, finalize]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the anonymous verifier without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Install exact public verification tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          cargo "+$RELEASE_RUST" install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oras
      - name: Download and verify release, attestations, WIT, and OCI anonymously
        env:
          CHECKSUM_ASSET_ID: ${{ needs.draft.outputs.checksum_asset_id }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
          MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          VERSION: ${{ needs.build.outputs.version }}
          WASM_ASSET_ID: ${{ needs.draft.outputs.wasm_asset_id }}
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          base="https://github.com/dekopon-agents/dekopon-provider-jsonplaceholder/releases/download/v$VERSION"
          mkdir "$RUNNER_TEMP/release"
          curl --fail --silent --show-error --location \
            "$base/jsonplaceholder-provider.wasm" -o "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm"
          curl --fail --silent --show-error --location \
            "$base/jsonplaceholder-provider.wasm.sha256" \
            -o "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm.sha256"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c jsonplaceholder-provider.wasm.sha256)
          [[ "$(awk '{print $1}' "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm.sha256")" == \
             "$EXPECTED_SHA" ]]
          release=$(curl --fail --silent --show-error \
            "https://api.github.com/repos/dekopon-agents/dekopon-provider-jsonplaceholder/releases/tags/v$VERSION")
          jq -e \
            --argjson release_id "$RELEASE_ID" \
            --argjson wasm_id "$WASM_ASSET_ID" \
            --argjson checksum_id "$CHECKSUM_ASSET_ID" '
              .id == $release_id and .draft == false and .prerelease == false and
              ([.assets[] | {name, id}] | sort_by(.name)) ==
                ([
                  {name: "jsonplaceholder-provider.wasm", id: $wasm_id},
                  {name: "jsonplaceholder-provider.wasm.sha256", id: $checksum_id}
                ] | sort_by(.name))
            ' <<<"$release" >/dev/null
          ./scripts/verify-attestation-anonymously.sh \
            "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm" \
            dekopon-agents/dekopon-provider-jsonplaceholder \
            "$EXPECTED_SHA" \
            'https://slsa.dev/provenance/v1' \
            dekopon-agents/dekopon-provider-jsonplaceholder/.github/workflows/release.yml \
            "$SOURCE_REF" \
            "$SOURCE_SHA" \
            "$SOURCE_RUN_ID" \
            "$SOURCE_RUN_ATTEMPT"
          ./scripts/verify-attestation-anonymously.sh \
            "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm" \
            dekopon-agents/dekopon-provider-jsonplaceholder \
            "$EXPECTED_SHA" \
            'https://cyclonedx.org/bom' \
            dekopon-agents/dekopon-provider-jsonplaceholder/.github/workflows/release.yml \
            "$SOURCE_REF" \
            "$SOURCE_SHA" \
            "$SOURCE_RUN_ID" \
            "$SOURCE_RUN_ATTEMPT"
          wasm-tools component wit --json "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm" \
            >"$RUNNER_TEMP/wit.json"
          wasm-tools component wit "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm" \
            >"$RUNNER_TEMP/component.wit"
          jq -e '
            (.worlds | length) == 1 and
            (.interfaces | length) == 1 and
            (.worlds[0].exports | keys | sort) == ["describe", "invoke"] and
            (.worlds[0].imports | length) == 1 and
            .packages[.interfaces[0].package].name == "dekopon:http@1.0.0" and
            .interfaces[0].name == "client" and
            (.interfaces[0].functions | keys) == ["send"] and
            ([.packages[].name] | sort) == ["dekopon:http@1.0.0", "root:component"]
          ' "$RUNNER_TEMP/wit.json" >/dev/null
          if grep -Eqi 'wasi:|wasix|wasi_snapshot|wasm-bindgen|js-sys' \
            "$RUNNER_TEMP/component.wit"; then
            echo 'error: ambient interface/runtime found in component' >&2
            exit 1
          fi
          printf '{"auths":{}}\n' >"$RUNNER_TEMP/anonymous-auth.json"
          anonymous=(--registry-config "$RUNNER_TEMP/anonymous-auth.json")
          [[ "$("$RUNNER_TEMP/oras" resolve "${anonymous[@]}" \
              "$OCI_REPOSITORY:$VERSION")" == "$MANIFEST_DIGEST" ]]
          mkdir "$RUNNER_TEMP/oci"
          (cd "$RUNNER_TEMP/oci" && "$RUNNER_TEMP/oras" pull "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST")
          test "$(find "$RUNNER_TEMP/oci" -maxdepth 1 -type f | wc -l)" -eq 1
          cmp "$RUNNER_TEMP/release/jsonplaceholder-provider.wasm" \
            "$RUNNER_TEMP/oci/jsonplaceholder-provider.wasm"
          "$RUNNER_TEMP/oras" manifest fetch "${anonymous[@]}" \
            "$OCI_REPOSITORY@$MANIFEST_DIGEST" >"$RUNNER_TEMP/manifest.json"
          jq -e --arg digest "sha256:$EXPECTED_SHA" '
            (.layers | length) == 1 and
            .layers[0].digest == $digest and
            .layers[0].mediaType == "application/wasm" and
            .layers[0].annotations["org.opencontainers.image.title"] == "jsonplaceholder-provider.wasm"
          ' "$RUNNER_TEMP/manifest.json" >/dev/null
          [[ "$("$RUNNER_TEMP/oras" repo tags "${anonymous[@]}" \
              "$OCI_REPOSITORY" | sort)" == "$VERSION" ]]

  cleanup:
    name: Roll back only immutable state owned by a failed or cancelled run
    needs: [build, attest, draft, ghcr, finalize, anonymous-verify]
    if: >-
      ${{ always() &&
          (contains(needs.*.result, 'failure') ||
           contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Delete the captured draft or finalized release.
      packages: write # Restore privacy and delete the captured package version.
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST_DIGEST: ${{ needs.ghcr.outputs.manifest_digest }}
      PACKAGE_ID: ${{ needs.ghcr.outputs.package_id }}
      PACKAGE_VERSION_ID: ${{ needs.ghcr.outputs.package_version_id }}
      PRIOR_VISIBILITY: ${{ needs.ghcr.outputs.prior_visibility }}
      PUSH_STARTED: ${{ needs.ghcr.outputs.push_started }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - name: Restore absence without mutable tag lookups and surface every cleanup error
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          api="$GITHUB_API_URL"
          headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          request() {
            local method=$1
            local endpoint=$2
            local output=$3
            local data=${4-}
            local status
            local args=(--silent --show-error --location --request "$method" \
              "${headers[@]}" --output "$output" --write-out '%{http_code}')
            if [[ -n "$data" ]]; then
              args+=(--header 'Content-Type: application/json' --data "$data")
            fi
            if ! status=$(curl "${args[@]}" "$api/$endpoint"); then
              echo "error: cleanup API request failed: $method $endpoint" >&2
              failures=$((failures + 1))
              printf '000'
              return
            fi
            printf '%s' "$status"
          }

          package_present=false
          current_package_id=
          if [[ "$PUSH_STARTED" == true || -n "$PACKAGE_VERSION_ID" ]]; then
            if [[ "$PRIOR_VISIBILITY" != absent ]]; then
              echo 'error: refusing package cleanup without captured prior absence' >&2
              failures=$((failures + 1))
            elif [[ ! "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo 'error: refusing package cleanup without an immutable manifest digest' >&2
              failures=$((failures + 1))
            else
              status=$(request GET "$PACKAGE_ENDPOINT" "$RUNNER_TEMP/package.json")
              case "$status" in
                200)
                  package_present=true
                  current_package_id=$(jq -er '.id' "$RUNNER_TEMP/package.json") || {
                    echo 'error: cleanup could not read package ID' >&2
                    failures=$((failures + 1))
                  }
                  if [[ -n "$PACKAGE_ID" && "$current_package_id" != "$PACKAGE_ID" ]]; then
                    echo 'error: current package ID differs from the captured owned ID' >&2
                    failures=$((failures + 1))
                    package_present=false
                  else
                    # Hide public bytes before deleting anything; the captured prior state was absent.
                    status=$(request PATCH "$PACKAGE_ENDPOINT/visibility" \
                      "$RUNNER_TEMP/package-private.json" '{"visibility":"private"}')
                    if [[ "$status" != 200 && "$status" != 204 ]]; then
                      echo "error: restoring package privacy returned HTTP $status" >&2
                      failures=$((failures + 1))
                      # Still attempt deletion by captured immutable digest to minimize exposure.
                    fi
                  fi
                  ;;
                404) ;;
                *)
                  echo "error: package cleanup discovery returned HTTP $status" >&2
                  failures=$((failures + 1))
                  ;;
              esac
            fi
          fi

          # Delete the exact release ID created by this run, whether it is still draft or finalized.
          if [[ -n "$RELEASE_ID" ]]; then
            if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
              echo 'error: captured release ID is invalid' >&2
              failures=$((failures + 1))
            else
              status=$(request GET "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                "$RUNNER_TEMP/release.json")
              case "$status" in
                200)
                  if [[ "$(jq -r '.tag_name' "$RUNNER_TEMP/release.json")" != \
                        "$SOURCE_TAG" ]]; then
                    echo 'error: captured release ID was mutated to a different tag' >&2
                    failures=$((failures + 1))
                  fi
                  # The immutable captured ID, not the mutable tag, establishes ownership.
                  status=$(request DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                    "$RUNNER_TEMP/release-delete.json")
                  if [[ "$status" != 204 && "$status" != 404 ]]; then
                    echo "error: release deletion returned HTTP $status" >&2
                    failures=$((failures + 1))
                  fi
                  ;;
                404) ;;
                *)
                  echo "error: release cleanup discovery returned HTTP $status" >&2
                  failures=$((failures + 1))
                  ;;
              esac
            fi
          fi

          if [[ "$package_present" == true ]]; then
            status=$(request GET "$PACKAGE_ENDPOINT/versions?per_page=100" \
              "$RUNNER_TEMP/versions.json")
            if [[ "$status" != 200 ]]; then
              echo "error: package version discovery returned HTTP $status" >&2
              failures=$((failures + 1))
            else
              owned_id=$PACKAGE_VERSION_ID
              if [[ -n "$owned_id" ]]; then
                match=$(jq --argjson id "$owned_id" --arg digest "$MANIFEST_DIGEST" \
                  '[.[] | select(.id == $id and .name == $digest)] | length' \
                  "$RUNNER_TEMP/versions.json")
                if [[ "$match" != 1 ]]; then
                  echo 'error: captured package version ID/digest ownership no longer matches' >&2
                  failures=$((failures + 1))
                  owned_id=
                fi
              else
                matches=$(jq --arg digest "$MANIFEST_DIGEST" \
                  '[.[] | select(.name == $digest)]' "$RUNNER_TEMP/versions.json")
                if [[ "$(jq 'length' <<<"$matches")" == 1 ]]; then
                  owned_id=$(jq -r '.[0].id' <<<"$matches")
                elif [[ "$(jq 'length' <<<"$matches")" != 0 ]]; then
                  echo 'error: immutable manifest digest maps to multiple package versions' >&2
                  failures=$((failures + 1))
                fi
              fi
              if [[ -n "$owned_id" ]]; then
                if [[ ! "$owned_id" =~ ^[0-9]+$ ]]; then
                  echo 'error: owned package version ID is invalid' >&2
                  failures=$((failures + 1))
                else
                  status=$(request DELETE "$PACKAGE_ENDPOINT/versions/$owned_id" \
                    "$RUNNER_TEMP/version-delete.json")
                  if [[ "$status" != 204 && "$status" != 404 ]]; then
                    echo "error: package version deletion returned HTTP $status" >&2
                    failures=$((failures + 1))
                  fi
                fi
              fi
            fi

            restored=false
            for _cleanup_attempt in {1..6}; do
              status=$(request GET "$PACKAGE_ENDPOINT" "$RUNNER_TEMP/package-after.json")
              case "$status" in
                404)
                  restored=true
                  break
                  ;;
                200)
                  status=$(request GET "$PACKAGE_ENDPOINT/versions?per_page=100" \
                    "$RUNNER_TEMP/versions-after.json")
                  if [[ "$status" != 200 ]]; then
                    echo "error: final package version discovery returned HTTP $status" >&2
                    failures=$((failures + 1))
                    break
                  fi
                  remaining=$(jq 'length' "$RUNNER_TEMP/versions-after.json")
                  non_owned=$(jq --arg digest "$MANIFEST_DIGEST" \
                    '[.[] | select(.name != $digest)] | length' \
                    "$RUNNER_TEMP/versions-after.json")
                  if [[ "$non_owned" != 0 ]]; then
                    echo 'error: package still has non-owned versions; left private, not deleted' >&2
                    failures=$((failures + 1))
                    break
                  fi
                  if [[ "$remaining" == 0 ]]; then
                    status=$(request DELETE "$PACKAGE_ENDPOINT" \
                      "$RUNNER_TEMP/package-delete.json")
                    if [[ "$status" == 404 ]]; then
                      restored=true
                      break
                    elif [[ "$status" != 204 ]]; then
                      echo "error: empty package deletion returned HTTP $status" >&2
                      failures=$((failures + 1))
                      break
                    fi
                  fi
                  # A deleted version/package can remain briefly observable; retry within a bound.
                  sleep 5
                  ;;
                *)
                  echo "error: package absence verification returned HTTP $status" >&2
                  failures=$((failures + 1))
                  break
                  ;;
              esac
            done
            if [[ "$restored" != true ]]; then
              echo 'error: initially absent package did not become absent after rollback' >&2
              failures=$((failures + 1))
            fi
          fi

          if ((failures != 0)); then
            echo "error: rollback completed with $failures surfaced failure(s)" >&2
            exit 1
          fi
          echo 'rollback verified: captured release/package state is absent'
